# Supabase pauses free projects after about a week without activity.
# This calls a harmless function twice a week so the form stays available.
name: Keep database awake
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping
        run: |
          curl --fail --silent --show-error -X POST \
            'https://glirczxsbdfvgnvqhqas.supabase.co/rest/v1/rpc/ping' \
            -H 'apikey: sb_publishable_cDJ7JX4tTxLSJGTkKORIhw_woU5kv5_' \
            -H 'Content-Type: application/json' -d '{}'
